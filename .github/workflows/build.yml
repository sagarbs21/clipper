name: Build APK

# Run on every push to main, and allow manual runs from the Actions tab.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 8.5 requires JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Provides Gradle 8.9 directly, so no committed gradle-wrapper.jar is needed.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Runners are ephemeral, so left alone every build gets a new random debug key.
      # A changed signature can't install over the previous APK, and the uninstall
      # that forces takes the saved API key and YouTube tokens with it. Creating the
      # key ourselves and caching it keeps one signature across builds, so new APKs
      # install as plain updates. These are the credentials AGP expects by default,
      # so it picks the file up without any signingConfig in the build script.
      - name: Restore the debug signing key
        id: debug-keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Create the debug signing key if none was cached
        if: steps.debug-keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storetype PKCS12 \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      # Printing the fingerprint makes it obvious in the log whether a build reused
      # the cached key or minted a new one that will require an uninstall.
      - name: Show the signing fingerprint
        run: |
          ls -l ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey | grep -i "SHA256:"

      # The ubuntu-latest runner ships with the Android SDK (ANDROID_HOME set),
      # including API 34, so AGP can build without extra setup.
      # GEMINI_API_KEY is read from a repo secret and baked into BuildConfig.
      # If the secret is unset, the build still succeeds and you enter the key in-app.
      - name: Build debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shorts-clipper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
